name: 매일 숏폼 제작

on:
  schedule:
    # 매일 오전 8시 7분 (한국 시간)에 시작. GitHub 무료 예약은 30~60분 늦게 도는 일이 흔해서
    # 업로드(11:07)보다 여유 있게 일찍 시작하고, 빠질 때를 대비해 여러 번 시도한다.
    # 오늘 영상이 이미 있으면 바로 건너뛴다.
    - cron: "7 23 * * *"
    - cron: "37 0 * * *"
    - cron: "7 1 * * *"
    - cron: "37 1 * * *"
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      keyword:
        description: "키워드 직접 지정 (비우면 오늘 순서대로)"
        required: false
        default: ""
      dry_run:
        description: "1이면 업로드 없이 영상만 만들어 확인"
        required: false
        default: "0"
      test_backup:
        description: "시험용: 1이면 대체 음성·기본 대본으로 만들어 봄 (dry_run과 함께)"
        required: false
        default: "0"
      redo_no:
        description: "이미 올린 N번 영상을 같은 번호로 다시 만들기 (비우면 새 상품)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 도구 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-noto-cjk-extra
          pip install -q requests pillow edge-tts
          mkdir -p fonts
          curl -fsSL -o /tmp/pd.zip https://github.com/orioncactus/pretendard/releases/download/v1.3.9/Pretendard-1.3.9.zip \
            && unzip -j -o -q /tmp/pd.zip "public/static/Pretendard-Black.otf" "public/static/Pretendard-Bold.otf" "public/static/Pretendard-Medium.otf" -d fonts || true
          for w in Black Bold Medium; do
            [ -s fonts/Pretendard-$w.otf ] || curl -fsSL -o fonts/Pretendard-$w.otf \
              https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/public/static/Pretendard-$w.otf || true
          done
          echo "::notice title=폰트::$(ls fonts | tr '\n' ' ')"

      - name: 영상 제작
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_KEYWORD: ${{ github.event.inputs.keyword }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          REDO_NO: ${{ github.event.inputs.redo_no }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE_BACKUP_TTS: ${{ github.event.inputs.test_backup }}
          FORCE_BACKUP_SCRIPT: ${{ github.event.inputs.test_backup }}
        run: python pipeline/run.py

      - name: 미리보기 보관 (확인용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: |
            work/*.mp4
            work/*.jpg
            work/entry.json
          if-no-files-found: ignore
          retention-days: 7

      - name: 사이트 저장
        if: success() && github.event.inputs.dry_run != '1'
        run: |
          git config user.name "livinglog7-bot"
          git config user.email "livinglog7-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "상품 추가/갱신: $(python -c 'import json;print(json.load(open("docs/latest.json"))["no"])')번"
          git pull --rebase -q origin main
          git push -q origin HEAD:main
